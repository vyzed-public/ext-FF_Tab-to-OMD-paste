<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clip to Markdown</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="container" id="mainContainer">
  <h1>&#x1F4CB; Clip to Markdown</h1>

  <div class="form-group">
    <label for="selectionInput">Selection / Purpose</label>
    <textarea id="selectionInput"></textarea>
    <div class="note">Will be placed above the markdown link (below).</div>
  </div>

  <div class="form-group">
    <label for="titleInput">Link Title (from tab)</label>
    <input type="text" id="titleInput" autofocus>
  </div>

  <div class="form-group">
    <label for="urlInput">URL</label>
    <input type="url" id="urlInput" readonly>
  </div>

  <div class="button-group">
    <button type="button" class="btn-copy" id="btnCopy">Clip</button>
    <button type="button" class="btn-cancel" id="btnCancel">Cancel</button>
  </div>
</div>

<script src="markdown.js"></script>
<script src="clipboard.js"></script>
<script src="popup.js"></script>
</body>
</html>
